name: Static analysis
# workflow_dispatch as well, for the same reason as CI: re-running after a
# change OUTSIDE the code should not need an empty commit.
on:
  push: { branches: [master] }
  pull_request:
    # The one path that cannot change an answer: nothing reads it but
    # Dependabot, and .github never reaches the zip.
    paths-ignore: ['.github/dependabot.yml']
  workflow_dispatch: {}

# A second push supersedes the run before it; without this the superseded run
# keeps a runner busy answering a question nobody waits for. Not on master: a
# cancelled push run leaves a commit that is already in with no proof.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          # The floor the plugin header promises. The analysed window is set in
          # phpstan.neon.dist and covers both ends; this is only the PHP that
          # runs the tool.
          php-version: '8.0'
          tools: composer

      # Installed into tools/phpstan, NOT into the plugin's own composer.json.
      # vendor/ at the top level is committed and SHIPS to every customer, so a
      # dev dependency there would travel with the plugin.
      - name: Install the analyser
        run: composer install --working-dir=tools/phpstan --no-interaction --no-progress --no-scripts --no-plugins

      # The stubs are large; the default 128M limit ends the run mid-analysis
      # with one "process crashed" line, which reads exactly like a clean sheet
      # if you only look at the count.
      - name: Analyse
        run: tools/phpstan/vendor/bin/phpstan analyse --no-progress --memory-limit=1G
