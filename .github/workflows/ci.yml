name: CI
# workflow_dispatch as well: without it a run can only be provoked by pushing,
# and re-running after fixing something OUTSIDE the code -- a billing setting,
# a repository going public -- means an empty commit.
on:
  push: { branches: [master] }
  pull_request:
    # The one path that cannot change an answer: nothing reads it but
    # Dependabot, and .github never reaches the zip.
    paths-ignore: ['.github/dependabot.yml']
  workflow_dispatch: {}

# A second push supersedes the run before it; without this the superseded run
# keeps a runner busy answering a question nobody waits for. Not on master: a
# cancelled push run leaves a commit that is already in with no proof.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # The floor the plugin header promises, and something current. A promise
      # in a header that nothing runs against is a promise to 40,000 sites that
      # nobody has checked.
      matrix: { php: ['8.0', '8.4'] }
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ matrix.php }}' }

      # Discover the set rather than name directories. A list written today
      # stops covering the file somebody adds tomorrow, and the file it stops
      # covering is never the one you expected.
      # `vendor/` is excluded and nothing else is. It is third-party code that
      # ships as released, and 27 files of it buried the output from ours.
      # Everything WE write is discovered rather than named -- a list written
      # today stops covering the file added tomorrow.
      - name: Lint
        run: find . -name '*.php' -not -path './.git/*' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      # The panel's sources, where `php -l` cannot look. It earns its place:
      # the first run found a hook called after an early return, which breaks
      # the moment the icon library is switched off and on again.
      - uses: actions/setup-node@v7
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Lint (panel sources)
        run: npm run lint

      # build/panel.js is committed and is what a customer runs; nothing else
      # rebuilds it. An edit to src/ without a rebuild ships the old panel and
      # looks, from the outside, like the change simply did not work.
      - name: The committed bundle is the one these sources build
        run: |
          set -euo pipefail
          npm run build
          if ! git diff --quiet -- build/; then
            echo "::error::build/ is out of date; run npm run build and commit the result"
            git diff --stat -- build/
            exit 1
          fi

      - name: Tests
        run: php tests/run.php

      # build-i18n.sh only helps when somebody runs it; this asks every time.
      # 8.4 only: the catalogue does not depend on the PHP version.
      - name: The catalogues carry every string
        if: matrix.php == '8.4'
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq gettext >/dev/null
          curl -sSLo wp https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          echo "be928f6b8ca1e8dfb9d2f4b75a13aa4aee0896f8a9a0a1c45cd5d2c98605e6172e6d014dda2e27f88c98befc16c040cbb2bd1bfa121510ea5cdf5f6a30fe8832  wp" | sha512sum -c -
          chmod +x wp && sudo mv wp /usr/local/bin/wp
          scripts/check-i18n.sh

      # This repository is public, so a self-hosted runner here would hand our
      # machine to whoever opens a pull request. Checked in CI rather than
      # written in a document, because the change that would break it is made
      # somewhere else entirely -- an organisation-scoped runner.
      - name: This repository never runs on our own machine
        run: php tests/runner.php

      # run.php shells out to this as well; the duplication is deliberate, so
      # removing that call cannot make the checks vanish quietly.
      - name: The icon core, in its own process
        run: php tests/icons.php

      - name: The Icons panel REST
        run: php tests/panel-rest.php

      # `if grep; then exit 1; fi`, not `! grep`. POSIX ignores -e when a
      # command's status is inverted with `!`, so the guard would set the step
      # to failure and the shell would carry straight on.
      - name: No hook name WordPress cannot fire
        run: |
          set -euo pipefail
          if grep -rnE "add_(action|filter)\( *'[a-z_]*[A-Z]" --include='*.php' . ; then
            echo "::error::a hook name carries a capital letter; core builds these names in lower case"
            exit 1
          fi
