# The panel, driven in a real browser.
#
# Its own workflow rather than a step in CI: this one starts WordPress in
# Docker and takes minutes where that one takes seconds, and a browser failure
# should be readable as a browser failure.
name: Panel E2E

on:
  pull_request: {}
  push: { branches: [master] }
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }

      - run: npm ci
      # The panel the specs drive is the BUILT bundle, not the sources.
      - run: npm run build
      - run: npx playwright install --with-deps chromium

      # .wp-env.json maps this repository in as the only plugin, so what CI
      # drives is the free panel alone -- no Pro tabs, which is the state a
      # wordpress.org visitor gets.
      - name: Start WordPress
        run: npx wp-env start

      # On a runner `localhost` resolves to ::1 first and wp-env listens on
      # IPv4 only. Moving the site's own url to 127.0.0.1 rather than just
      # pointing the browser there, so WordPress serves its scripts and fonts
      # from the origin the page is on.
      - name: Put the site on IPv4
        run: |
          npx wp-env run cli wp option update siteurl http://127.0.0.1:8888
          npx wp-env run cli wp option update home http://127.0.0.1:8888

      - name: E2E
        env: { WP_BASE_URL: 'http://127.0.0.1:8888' }
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
